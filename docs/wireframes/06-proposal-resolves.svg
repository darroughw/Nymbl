<svg viewBox="0 0 1280 1040" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="1040" fill="#fbfbfa"/>

  <text x="40" y="40" font-size="20" font-weight="700" fill="#111827">06 — A Proposed project resolves: clearing every Tentative fact tied to it</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">A third different flow: not a staffing decision or a request, but the moment a bet (Tentative/win-probability) stops being a bet.</text>

  <rect x="40" y="90" width="1000" height="760" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="40" y="90" width="1000" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="64" y="120" font-size="15" font-weight="700" fill="#111827">Harbor &amp; Pine</text>
  <text x="200" y="120" font-size="12" fill="#6b7280">Enrollment Redesign — Pinecrest Schools</text>

  <!-- Won panel -->
  <rect x="64" y="156" width="450" height="534" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <rect x="64" y="156" width="450" height="40" rx="8" fill="#dcfce7"/>
  <text x="84" y="181" font-size="13" font-weight="700" fill="#166534">WON — client signed, Nov 20</text>

  <text x="84" y="220" font-size="11" fill="#6b7280" letter-spacing="1">TENTATIVE ASSIGNMENTS TO RESOLVE</text>
  <g font-size="12">
    <rect x="84" y="230" width="410" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="100" y="250" font-weight="700" fill="#111827">Priya Raman</text>
    <text x="100" y="266" font-size="10" fill="#6b7280">Solution Architect · 50% · was Tentative</text>
    <rect x="370" y="242" width="110" height="26" rx="4" fill="#1d4ed8"/>
    <text x="380" y="259" font-size="10" fill="#ffffff" font-weight="700">Confirm</text>

    <rect x="84" y="288" width="410" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="100" y="308" font-weight="700" fill="#111827">Sofia Marquez</text>
    <text x="100" y="324" font-size="10" fill="#6b7280">Delivery Manager · 50% · was Tentative</text>
    <rect x="370" y="300" width="110" height="26" rx="4" fill="#1d4ed8"/>
    <text x="380" y="317" font-size="10" fill="#ffffff" font-weight="700">Confirm</text>
  </g>

  <text x="84" y="368" font-size="11" fill="#6b7280" letter-spacing="1">OPEN ROLES, NOW REAL (WERE "IF WON")</text>
  <g font-size="12">
    <rect x="84" y="378" width="410" height="52" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="100" y="398" font-weight="700" fill="#78350f">Mid Software Engineer</text>
    <text x="100" y="414" font-size="10" fill="#92400e">React · TypeScript — priority just changed to Must fill</text>
    <rect x="370" y="390" width="110" height="26" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="378" y="407" font-size="10" fill="#374151">Staff it →</text>

    <rect x="84" y="436" width="410" height="52" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="100" y="456" font-weight="700" fill="#78350f">Mid Product Designer</text>
    <text x="100" y="472" font-size="10" fill="#92400e">Figma · UX research — priority just changed to Must fill</text>
    <rect x="370" y="448" width="110" height="26" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="378" y="465" font-size="10" fill="#374151">Staff it →</text>
  </g>

  <rect x="84" y="512" width="410" height="50" rx="4" fill="#1d4ed8"/>
  <text x="100" y="542" font-size="12" fill="#ffffff" font-weight="700">Confirm all 2 Tentative assignments</text>

  <!-- Lost panel -->
  <rect x="534" y="156" width="450" height="534" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <rect x="534" y="156" width="450" height="40" rx="8" fill="#feecea"/>
  <text x="554" y="181" font-size="13" font-weight="700" fill="#b42318">LOST — client went with another firm, Nov 20</text>

  <text x="554" y="220" font-size="11" fill="#6b7280" letter-spacing="1">TENTATIVE ASSIGNMENTS TO RELEASE</text>
  <g font-size="12">
    <rect x="554" y="230" width="410" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="570" y="250" font-weight="700" fill="#111827">Priya Raman</text>
    <text x="570" y="266" font-size="10" fill="#6b7280">Solution Architect · 50% Tentative — now released</text>
    <rect x="840" y="242" width="104" height="26" rx="4" fill="#dcfce7"/>
    <text x="850" y="259" font-size="10" fill="#166534" font-weight="700">50% freed</text>

    <rect x="554" y="288" width="410" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="570" y="308" font-weight="700" fill="#111827">Sofia Marquez</text>
    <text x="570" y="324" font-size="10" fill="#6b7280">Delivery Manager · 50% Tentative — now released</text>
    <rect x="840" y="300" width="104" height="26" rx="4" fill="#dcfce7"/>
    <text x="850" y="317" font-size="10" fill="#166534" font-weight="700">50% freed</text>
  </g>

  <text x="554" y="368" font-size="11" fill="#6b7280" letter-spacing="1">OPEN ROLES — WITHDRAWN</text>
  <g font-size="12">
    <rect x="554" y="378" width="410" height="52" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="570" y="398" fill="#6b7280" text-decoration="line-through">Mid Software Engineer</text>
    <text x="570" y="414" font-size="10" fill="#9ca3af">No longer needed — role removed from open list</text>

    <rect x="554" y="436" width="410" height="52" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="570" y="456" fill="#6b7280" text-decoration="line-through">Mid Product Designer</text>
    <text x="570" y="472" font-size="10" fill="#9ca3af">No longer needed — role removed from open list</text>
  </g>

  <rect x="554" y="512" width="410" height="50" rx="4" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="572" y="542" font-size="12" fill="#b91c1c" font-weight="700">Release all 2 Tentative assignments</text>

  <!-- Both-panel footer -->
  <rect x="64" y="604" width="920" height="64" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="84" y="628" font-size="11" fill="#4b5563">Priya and Sofia's freed or confirmed 50% shows up on the Monday view's load numbers the moment this resolves —</text>
  <text x="84" y="646" font-size="11" fill="#4b5563">not after someone remembers to go update their assignments by hand.</text>

  <!-- Numbered badges -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="500" cy="196" r="11" fill="#1d4ed8"/>
    <text x="500" y="200">1</text>

    <circle cx="970" cy="268" r="11" fill="#166534"/>
    <text x="970" y="272">2</text>

    <circle cx="500" cy="536" r="11" fill="#b91c1c"/>
    <text x="500" y="540">3</text>
  </g>

  <!-- Legend -->
  <g font-size="13">
    <circle cx="56" cy="702" r="10" fill="#1d4ed8"/>
    <text x="56" y="706" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">1</text>
    <text x="76" y="707" fill="#111827" font-weight="700">One screen clears every Tentative fact a project decision touches.</text>
    <text x="76" y="724" fill="#4b5563">Without this, resolving a Proposed project means hunting down each affected assignment individually — the exact spreadsheet problem this product replaces.</text>

    <circle cx="56" cy="748" r="10" fill="#166534"/>
    <text x="56" y="752" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">2</text>
    <text x="76" y="753" fill="#111827" font-weight="700">A loss frees capacity visibly, not silently.</text>
    <text x="76" y="770" fill="#4b5563">"50% freed" is good news worth surfacing — Priya is suddenly available for something else, and that fact shouldn't require someone to notice on their own.</text>

    <circle cx="56" cy="794" r="10" fill="#b91c1c"/>
    <text x="56" y="798" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">3</text>
    <text x="76" y="799" fill="#111827" font-weight="700">Confirming is a deliberate act, never automatic.</text>
    <text x="76" y="816" fill="#4b5563">Even on a Won project, Tentative → Confirmed is a click, not a background job — the person who owns the client risk stays the one who converts it.</text>
  </g>

  <text x="40" y="1000" font-size="11" fill="#9ca3af">Harbor &amp; Pine · wireframe 6, a third different flow (resolving a bet, not making a staffing call) · grayscale = structure, accent color = annotation, not UI</text>
</svg>
