<svg viewBox="0 0 1280 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="1000" fill="#fbfbfa"/>

  <text x="40" y="40" font-size="20" font-weight="700" fill="#111827">05 — Delivery Manager: ask for people, see when you'll get them</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">A different flow and a different persona: the brief names two users — this is the second one, not the Resource Manager.</text>

  <rect x="40" y="90" width="1000" height="700" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="40" y="90" width="1000" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="64" y="120" font-size="15" font-weight="700" fill="#111827">Harbor &amp; Pine</text>
  <text x="200" y="120" font-size="12" fill="#6b7280">Jordan Ellis · Delivery Manager · Field Ops Platform</text>

  <!-- New request, collapsed summary form -->
  <text x="64" y="162" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="1">REQUEST A ROLE</text>
  <rect x="64" y="172" width="912" height="70" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <g font-size="11" fill="#374151">
    <text x="84" y="196">Role: [Software Engineer ▾]   Level: [Senior ▾]   Allocation: [100%]</text>
    <text x="84" y="216">Skills: [.NET] [Azure] [SQL] +    Window: [2026-11-16] → [2027-05-28]    Priority: [Must fill ▾]</text>
  </g>
  <rect x="868" y="188" width="92" height="30" rx="4" fill="#1d4ed8"/>
  <text x="884" y="207" font-size="11" fill="#ffffff" font-weight="700">Submit ask</text>

  <!-- Requests list -->
  <text x="64" y="276" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="1">YOUR OPEN ASKS</text>

  <g font-size="12">
    <rect x="64" y="288" width="912" height="64" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="84" y="310" font-weight="700" fill="#111827">Senior Software Engineer</text>
    <text x="84" y="328" font-size="11" fill="#6b7280">.NET · Azure · SQL — 100%, starts 2026-11-16</text>
    <rect x="700" y="302" width="130" height="20" rx="10" fill="#dcfce7"/>
    <text x="712" y="316" font-size="10" fill="#166534" font-weight="700">Matched · RM reviewing</text>
    <text x="700" y="340" font-size="10" fill="#6b7280">Expect an answer by Nov 9</text>

    <rect x="64" y="360" width="912" height="64" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="84" y="382" font-weight="700" fill="#111827">Senior Product Designer</text>
    <text x="84" y="400" font-size="11" fill="#6b7280">UX research · Interaction design — 50%, starts 2026-11-16</text>
    <rect x="700" y="374" width="150" height="20" rx="10" fill="#fef3c7"/>
    <text x="712" y="388" font-size="10" fill="#92400e" font-weight="700">No strong match yet</text>
    <text x="700" y="412" font-size="10" fill="#6b7280">RM is weighing a stretch assignment — no ETA yet</text>

    <rect x="64" y="432" width="912" height="64" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="84" y="454" font-weight="700" fill="#111827">Mid Delivery Manager</text>
    <text x="84" y="472" font-size="11" fill="#6b7280">Agile · Client management — 50%, starts 2026-11-16</text>
    <rect x="700" y="446" width="90" height="20" rx="10" fill="#dcfce7"/>
    <text x="712" y="460" font-size="10" fill="#166534" font-weight="700">Filled</text>
    <text x="700" y="484" font-size="10" fill="#4b5563">Kevin O'Brien, confirmed Nov 1</text>

    <rect x="64" y="504" width="912" height="64" rx="6" fill="#ffffff" stroke="#d1d5db" opacity="0.85"/>
    <text x="84" y="526" font-weight="700" fill="#111827">Mid Software Engineer</text>
    <text x="84" y="544" font-size="11" fill="#6b7280">React · TypeScript — 100%, starts 2026-12-07 — Enrollment Redesign</text>
    <rect x="700" y="518" width="150" height="20" rx="10" fill="#f3f4f6"/>
    <text x="712" y="532" font-size="10" fill="#374151" font-weight="700">Contingent on signing</text>
    <text x="700" y="556" font-size="10" fill="#6b7280">Pinecrest Schools decision expected Nov 20</text>
  </g>

  <!-- Numbered badges -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="830" cy="340" r="11" fill="#1d4ed8"/>
    <text x="830" y="344">1</text>

    <circle cx="850" cy="412" r="11" fill="#92400e"/>
    <text x="850" y="416">2</text>

    <circle cx="790" cy="484" r="11" fill="#166534"/>
    <text x="790" y="488">3</text>
  </g>

  <!-- Legend -->
  <g font-size="13">
    <circle cx="56" cy="606" r="10" fill="#1d4ed8"/>
    <text x="56" y="610" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">1</text>
    <text x="76" y="611" fill="#111827" font-weight="700">The one number a DM actually needs: when, not how.</text>
    <text x="76" y="628" fill="#4b5563">"Expect an answer by Nov 9" is the whole point of this screen — the brief's own framing of what a DM needs to know.</text>

    <circle cx="56" cy="652" r="10" fill="#92400e"/>
    <text x="56" y="656" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">2</text>
    <text x="76" y="657" fill="#111827" font-weight="700">"No strong match yet" is visible to the asker, not just the RM.</text>
    <text x="76" y="674" fill="#4b5563">A DM who knows a role is struggling two weeks out can replan around it. One who finds out on day one of the project can't.</text>

    <circle cx="56" cy="698" r="10" fill="#166534"/>
    <text x="56" y="702" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">3</text>
    <text x="76" y="703" fill="#111827" font-weight="700">A filled ask names who, confirming closure from the asking side too.</text>
    <text x="76" y="720" fill="#4b5563">The RM's "Filled" panel (wireframe 01) and this card are the same fact, read by the two different people who each needed to know it.</text>
  </g>

  <!-- Relationship to Surface B note -->
  <rect x="40" y="802" width="1000" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="828" font-size="12" font-weight="700" fill="#111827">How this connects to the built prototype</text>
  <text x="60" y="850" font-size="11" fill="#4b5563">"Submit ask" here is exactly what produces a row in wireframe 01's open-roles list — one event, two views. The RM's staffing-flow</text>
  <text x="60" y="866" font-size="11" fill="#4b5563">prototype (the coded deliverable) implements the RM half of this loop; this screen sketches the DM half it currently assumes exists</text>
  <text x="60" y="882" font-size="11" fill="#4b5563">upstream. Building both halves was out of scope for a five-hour window — this wireframe exists so that gap is a stated choice.</text>

  <text x="40" y="960" font-size="11" fill="#9ca3af">Harbor &amp; Pine · wireframe 5, a different flow and persona (Delivery Manager) · grayscale = structure, accent color = annotation, not UI</text>
</svg>
