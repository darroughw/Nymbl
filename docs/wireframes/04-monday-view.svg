<svg viewBox="0 0 1280 1040" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="1040" fill="#fbfbfa"/>

  <text x="40" y="40" font-size="20" font-weight="700" fill="#111827">04 — Monday view (Surface A, the surface not chosen)</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">A different flow from 01-03: the landing dashboard, not the staffing decision. Shown for context on why B was chosen.</text>

  <rect x="40" y="90" width="1000" height="760" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="40" y="90" width="1000" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="64" y="120" font-size="15" font-weight="700" fill="#111827">Harbor &amp; Pine</text>
  <text x="200" y="120" font-size="12" fill="#6b7280">Monday · 2026-11-02</text>

  <!-- Stat strip -->
  <g>
    <rect x="64" y="158" width="296" height="76" rx="8" fill="#feecea" stroke="#f3b9b2"/>
    <text x="84" y="192" font-size="26" font-weight="700" fill="#b42318">3</text>
    <text x="84" y="214" font-size="12" fill="#7a2a22">overloaded this week</text>

    <rect x="372" y="158" width="296" height="76" rx="8" fill="#feecea" stroke="#f3b9b2"/>
    <text x="392" y="192" font-size="26" font-weight="700" fill="#b42318">4</text>
    <text x="392" y="214" font-size="12" fill="#7a2a22">Must-fill roles still open</text>

    <rect x="680" y="158" width="296" height="76" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="700" y="192" font-size="26" font-weight="700" fill="#92400e">1</text>
    <text x="700" y="214" font-size="12" fill="#78350f">decision needed today</text>
  </g>

  <!-- Overloaded list -->
  <text x="64" y="268" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="1">OVERLOADED THIS WEEK</text>
  <g font-size="12">
    <rect x="64" y="280" width="450" height="46" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="80" y="300" font-weight="700" fill="#111827">Grace Liu</text>
    <text x="80" y="316" font-size="10" fill="#6b7280">Claims Dashboard — logging 122% of capacity, 4 weeks running</text>
    <rect x="420" y="294" width="80" height="18" rx="9" fill="#feecea"/>
    <text x="432" y="307" font-size="10" fill="#b42318" font-weight="700">122%</text>

    <rect x="64" y="332" width="450" height="46" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="80" y="352" font-weight="700" fill="#111827">Ryan Patel</text>
    <text x="80" y="368" font-size="10" fill="#6b7280">Dispatch Portal — logging 110% of capacity, 4 weeks running</text>
    <rect x="420" y="346" width="80" height="18" rx="9" fill="#feecea"/>
    <text x="432" y="359" font-size="10" fill="#b42318" font-weight="700">110%</text>

    <rect x="64" y="384" width="450" height="46" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="80" y="404" font-weight="700" fill="#111827">Aisha Bello</text>
    <text x="80" y="420" font-size="10" fill="#6b7280">Member Onboarding — 100% planned, trending over on logged hours</text>
    <rect x="420" y="398" width="80" height="18" rx="9" fill="#fef3c7"/>
    <text x="432" y="411" font-size="10" fill="#92400e" font-weight="700">~105%</text>
  </g>

  <!-- Open roles list -->
  <text x="556" y="268" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="1">MUST-FILL ROLES, OPEN</text>
  <g font-size="12">
    <rect x="556" y="280" width="420" height="46" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="572" y="300" font-weight="700" fill="#111827">Field Ops Platform</text>
    <text x="572" y="316" font-size="10" fill="#6b7280">4 of 5 roles still open · starts in 2 weeks</text>
    <rect x="876" y="294" width="84" height="18" rx="9" fill="#feecea"/>
    <text x="886" y="307" font-size="10" fill="#b42318" font-weight="700">2 wks out</text>

    <rect x="556" y="332" width="420" height="46" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="572" y="352" font-weight="700" fill="#111827">Enrollment Redesign</text>
    <text x="572" y="368" font-size="10" fill="#6b7280">2 roles, If won — client decision expected Nov 20</text>
    <rect x="876" y="346" width="84" height="18" rx="9" fill="#f3f4f6"/>
    <text x="886" y="359" font-size="10" fill="#374151" font-weight="700">contingent</text>
  </g>

  <!-- Needs a decision today -->
  <text x="64" y="454" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="1">NEEDS A DECISION TODAY</text>
  <rect x="64" y="466" width="912" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="80" y="488" font-size="12" fill="#78350f" font-weight="700">Fatima Noor's assignment on Inventory Sync has no recorded end date.</text>
  <text x="80" y="505" font-size="11" fill="#78350f">Confirm whether she's still active on it before she's considered for Field Ops Platform.</text>

  <!-- Two-week outlook strip -->
  <text x="64" y="562" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="1">WHAT CHANGES IN THE NEXT TWO WEEKS</text>
  <rect x="64" y="574" width="912" height="90" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <text x="84" y="602" font-size="12" fill="#374151">Nov 6 — Olivia Brooks rolls off Inventory Sync (wrapping up)</text>
  <text x="84" y="624" font-size="12" fill="#374151">Nov 13 — Inventory Sync ends; Omar Haddad, Sam Rivera, Fatima Noor* all come open</text>
  <text x="84" y="646" font-size="12" fill="#374151">Nov 16 — Field Ops Platform starts, still short 4 roles</text>

  <!-- Numbered badges -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="186" cy="196" r="11" fill="#1d4ed8"/>
    <text x="186" y="200">1</text>

    <circle cx="500" cy="290" r="11" fill="#1d4ed8"/>
    <text x="500" y="294">2</text>

    <circle cx="500" cy="490" r="11" fill="#b91c1c"/>
    <text x="500" y="494">3</text>
  </g>

  <!-- Legend -->
  <g font-size="13">
    <circle cx="56" cy="702" r="10" fill="#1d4ed8"/>
    <text x="56" y="706" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">1</text>
    <text x="76" y="707" fill="#111827" font-weight="700">Three counts answer the Monday question before any click.</text>
    <text x="76" y="724" fill="#4b5563">Who's open, who's overloaded, what needs a decision — in seconds, not a meeting, per the brief's own framing.</text>

    <circle cx="56" cy="748" r="10" fill="#1d4ed8"/>
    <text x="56" y="752" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">2</text>
    <text x="76" y="753" fill="#111827" font-weight="700">Every row is an entry point into the staffing flow (03-01), not a dead end.</text>
    <text x="76" y="770" fill="#4b5563">Clicking "Field Ops Platform" lands directly in wireframe 01's role detail — one product, two altitudes, not two disconnected screens.</text>

    <circle cx="56" cy="794" r="10" fill="#b91c1c"/>
    <text x="56" y="798" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">3</text>
    <text x="76" y="799" fill="#111827" font-weight="700">The same "don't silently fix data" rule holds across surfaces.</text>
    <text x="76" y="816" fill="#4b5563">A null assignment end date is a decision item here, not a bug swallowed by a default — consistent with how 02-decision-ranking treats missing skills.</text>
  </g>

  <!-- Why B over A note -->
  <rect x="40" y="862" width="1000" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="888" font-size="12" font-weight="700" fill="#111827">Why B, not A, got built this round</text>
  <text x="60" y="910" font-size="11" fill="#4b5563">A rewards strong information hierarchy on a dashboard. B rewards a stateful decision with a before/after — closer to what a Senior</text>
  <text x="60" y="926" font-size="11" fill="#4b5563">Design Engineer is actually judged on here. This wireframe exists so the choice reads as deliberate, not as "didn't get to it" —</text>
  <text x="60" y="942" font-size="11" fill="#4b5563">and because A's rows need to point somewhere: B is that somewhere.</text>

  <text x="40" y="1020" font-size="11" fill="#9ca3af">Harbor &amp; Pine · wireframe 4, a different flow (Surface A) · grayscale = structure, accent color = annotation, not UI</text>
</svg>
