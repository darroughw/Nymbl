<svg viewBox="0 0 1280 1120" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="1120" fill="#fbfbfa"/>

  <text x="40" y="40" font-size="20" font-weight="700" fill="#111827">03 — Commit: assign-impact dialog</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">The one true confirmation step. Nothing commits until here — two variants shown: overloaded, and tentative.</text>

  <!-- Dimmed backdrop representing the page behind the dialog -->
  <rect x="40" y="90" width="1000" height="760" rx="8" fill="#eef0f2" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="440" y="470" font-size="13" fill="#b5bac2">(page content dimmed behind modal)</text>

  <!-- Dialog A: overallocation -->
  <rect x="90" y="140" width="430" height="400" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="116" y="176" font-size="15" font-weight="700" fill="#111827">Assign Aisha Bello to</text>
  <text x="116" y="196" font-size="15" font-weight="700" fill="#111827">Software Engineer</text>
  <text x="116" y="216" font-size="11" fill="#6b7280">Field Ops Platform — 2026-11-16 to 2027-05-28</text>

  <text x="116" y="250" font-size="10" fill="#9ca3af" letter-spacing="1">LOAD DURING THIS WINDOW</text>
  <g font-size="11" fill="#374151">
    <text x="116" y="270">Inventory Sync</text>
    <text x="460" y="270" text-anchor="end">100%</text>
    <line x1="116" y1="278" x2="460" y2="278" stroke="#f1f5f9"/>
    <text x="116" y="294" font-weight="700" fill="#1d4ed8">Software Engineer (new)</text>
    <text x="460" y="294" text-anchor="end" font-weight="700" fill="#1d4ed8">100%</text>
  </g>

  <g font-size="11" fill="#6b7280">
    <text x="116" y="332">Before</text>
    <rect x="116" y="340" width="150" height="7" rx="3.5" fill="#b91c1c"/>
    <text x="116" y="362">100%</text>

    <text x="300" y="332">After</text>
    <rect x="300" y="340" width="150" height="7" rx="3.5" fill="#b91c1c"/>
    <text x="300" y="362" fill="#b91c1c" font-weight="700">200%</text>
  </g>

  <rect x="116" y="382" width="378" height="66" rx="6" fill="#feecea" stroke="#f3b9b2"/>
  <text x="130" y="402" font-size="11" fill="#b42318" font-weight="700">This puts Aisha at 200%, 100 points over</text>
  <text x="130" y="418" font-size="11" fill="#b42318" font-weight="700">capacity. You can still commit — overallocation</text>
  <text x="130" y="434" font-size="11" fill="#b42318" font-weight="700">is a real choice — but it won't be invisible.</text>

  <rect x="304" y="486" width="80" height="30" rx="4" fill="#ffffff" stroke="#9ca3af"/>
  <text x="322" y="506" font-size="11" fill="#374151">Cancel</text>
  <rect x="392" y="486" width="140" height="30" rx="4" fill="#1d4ed8"/>
  <text x="406" y="506" font-size="11" fill="#ffffff" font-weight="700">Confirm assignment</text>

  <!-- Dialog B: tentative -->
  <rect x="560" y="140" width="430" height="400" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="586" y="176" font-size="15" font-weight="700" fill="#111827">Assign Sam Rivera to</text>
  <text x="586" y="196" font-size="15" font-weight="700" fill="#111827">Software Engineer</text>
  <text x="586" y="216" font-size="11" fill="#6b7280">Enrollment Redesign — 2026-12-07 to 2027-04-30</text>

  <rect x="586" y="232" width="378" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="600" y="252" font-size="11" fill="#78350f" font-weight="700">Enrollment Redesign hasn't closed. This records</text>
  <text x="600" y="268" font-size="11" fill="#78350f" font-weight="700">a Tentative assignment — it shows as load but</text>
  <text x="600" y="284" font-size="11" fill="#78350f" font-weight="700">won't become real work unless the project is won.</text>

  <text x="586" y="318" font-size="10" fill="#9ca3af" letter-spacing="1">LOAD DURING THIS WINDOW</text>
  <g font-size="11" fill="#374151">
    <text x="586" y="338">(nothing currently booked)</text>
    <line x1="586" y1="346" x2="930" y2="346" stroke="#f1f5f9"/>
    <text x="586" y="362" font-weight="700" fill="#1d4ed8">Software Engineer (new)</text>
    <text x="930" y="362" text-anchor="end" font-weight="700" fill="#1d4ed8">100%</text>
  </g>

  <g font-size="11" fill="#6b7280">
    <text x="586" y="400">Before</text>
    <rect x="586" y="408" width="150" height="7" rx="3.5" fill="#e5e7eb"/>
    <text x="586" y="430">0%</text>

    <text x="770" y="400">After</text>
    <rect x="770" y="408" width="150" height="7" rx="3.5" fill="#b91c1c"/>
    <text x="770" y="430" fill="#b91c1c" font-weight="700">100%</text>
  </g>

  <rect x="774" y="486" width="80" height="30" rx="4" fill="#ffffff" stroke="#9ca3af"/>
  <text x="792" y="506" font-size="11" fill="#374151">Cancel</text>
  <rect x="862" y="486" width="140" height="30" rx="4" fill="#1d4ed8"/>
  <text x="876" y="506" font-size="11" fill="#ffffff" font-weight="700">Confirm assignment</text>

  <!-- Focus/keyboard annotation strip -->
  <rect x="90" y="580" width="900" height="240" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="112" y="608" font-size="12" font-weight="700" fill="#111827">Focus and keyboard, across the whole dialog lifecycle</text>

  <g font-size="11" fill="#374151">
    <rect x="112" y="624" width="150" height="28" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="128" y="642">Assign button</text>
    <text x="268" y="642" fill="#9ca3af">— Enter/click —&gt;</text>
    <rect x="376" y="624" width="110" height="28" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="396" y="642">Cancel (auto-focused)</text>
    <text x="494" y="642" fill="#9ca3af">— Tab —&gt;</text>
    <rect x="556" y="624" width="180" height="28" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <text x="572" y="642">Confirm assignment</text>
  </g>

  <text x="112" y="676" font-size="11" fill="#4b5563">Native &lt;dialog&gt; + showModal(): the browser traps Tab inside the dialog, so focus can never land on the dimmed</text>
  <text x="112" y="692" font-size="11" fill="#4b5563">page behind it — no hand-rolled trap to get wrong.</text>

  <text x="112" y="722" font-size="11" fill="#4b5563">Escape or Cancel closes through the same onCancel state update either way — verified in-browser that React's</text>
  <text x="112" y="738" font-size="11" fill="#4b5563">JSX onCancel/onClose props on &lt;dialog&gt; don't reliably fire; fixed with a manual native "cancel" listener.</text>

  <text x="112" y="768" font-size="11" fill="#4b5563">On confirm: the triggering Assign button is about to unmount (role becomes "Filled"). Native focus-return has</text>
  <text x="112" y="784" font-size="11" fill="#4b5563">nothing to return to, so focus is moved explicitly to the new "Filled" panel's heading, and the change is</text>
  <text x="112" y="800" font-size="11" fill="#4b5563">announced through an aria-live region — see wireframe 01's "Filled" card for where focus lands.</text>

  <!-- Numbered badges -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="500" cy="150" r="11" fill="#b91c1c"/>
    <text x="500" y="154">1</text>

    <circle cx="970" cy="150" r="11" fill="#f59e0b"/>
    <text x="970" y="154">2</text>
  </g>
  <g font-size="13">
    <circle cx="56" cy="860" r="10" fill="#b91c1c"/>
    <text x="56" y="864" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">1</text>
    <text x="76" y="865" fill="#111827" font-weight="700">Overallocation is flagged, not blocked.</text>
    <text x="76" y="882" fill="#4b5563">A deliberate two-week crunch is sometimes the right call — the job is to make it visible, never to prevent it outright.</text>

    <circle cx="56" cy="906" r="10" fill="#f59e0b"/>
    <text x="56" y="910" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">2</text>
    <text x="76" y="911" fill="#111827" font-weight="700">Tentative is stated in plain language before commit, not after.</text>
    <text x="76" y="928" fill="#4b5563">Matches the Confirmed/Tentative convention already in Harbor &amp; Pine's own data — not a new status invented for this screen.</text>
  </g>

  <text x="40" y="1100" font-size="11" fill="#9ca3af">Harbor &amp; Pine staffing flow · wireframe 3 of 3 · grayscale = structure, accent color = annotation, not UI</text>
</svg>
