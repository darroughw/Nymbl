<svg viewBox="0 0 1280 1060" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1280" height="1060" fill="#fbfbfa"/>

  <!-- Title block -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#111827">01 — Landing: triage view</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">Resource Manager opens the staffing flow. State always visible before any action is taken.</text>

  <!-- App frame -->
  <rect x="40" y="90" width="1000" height="760" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- App header -->
  <rect x="40" y="90" width="1000" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="64" y="120" font-size="15" font-weight="700" fill="#111827">Harbor &amp; Pine</text>
  <text x="200" y="120" font-size="12" fill="#6b7280">Staffing a new role · today is 2026-11-02</text>

  <!-- Left nav: role list -->
  <rect x="40" y="138" width="280" height="712" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
  <text x="60" y="164" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="1">OPEN ROLES</text>

  <!-- role cards -->
  <g font-size="12">
    <rect x="56" y="178" width="248" height="62" rx="6" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="68" y="198" font-weight="700" fill="#111827">Software Engineer</text>
    <rect x="248" y="186" width="46" height="16" rx="8" fill="#fecaca"/>
    <text x="256" y="197" font-size="9" fill="#7f1d1d" font-weight="700">MUST FILL</text>
    <text x="68" y="214" fill="#6b7280" font-size="11">Field Ops Platform</text>
    <text x="68" y="228" fill="#9ca3af" font-size="10">Senior · 100% · starts 2026-11-16</text>

    <rect x="56" y="248" width="248" height="62" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="68" y="268" fill="#111827">Delivery Manager</text>
    <rect x="248" y="256" width="46" height="16" rx="8" fill="#fecaca"/>
    <text x="256" y="267" font-size="9" fill="#7f1d1d" font-weight="700">MUST FILL</text>
    <text x="68" y="284" fill="#6b7280" font-size="11">Field Ops Platform</text>
    <text x="68" y="298" fill="#9ca3af" font-size="10">Mid · 50% · starts 2026-11-16</text>

    <rect x="56" y="318" width="248" height="62" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="68" y="338" fill="#111827">QA Engineer</text>
    <rect x="248" y="326" width="56" height="16" rx="8" fill="#dbeafe"/>
    <text x="256" y="337" font-size="9" fill="#1e3a8a" font-weight="700">NICE TO FILL</text>
    <text x="68" y="354" fill="#6b7280" font-size="11">Field Ops Platform</text>
    <text x="68" y="368" fill="#9ca3af" font-size="10">Mid · 50% · starts 2026-12-07</text>

    <rect x="56" y="388" width="248" height="62" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1" opacity="0.8"/>
    <text x="68" y="408" fill="#111827">Software Engineer</text>
    <rect x="252" y="396" width="42" height="16" rx="8" fill="#e5e7eb"/>
    <text x="259" y="407" font-size="9" fill="#374151" font-weight="700">IF WON</text>
    <text x="68" y="424" fill="#6b7280" font-size="11">Enrollment Redesign</text>
    <text x="68" y="438" fill="#9ca3af" font-size="10">Mid · 100% · starts 2026-12-07</text>

    <rect x="56" y="458" width="248" height="40" rx="6" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
    <text x="68" y="482" fill="#166534">✓ Filled · Omar Haddad</text>
  </g>

  <!-- Right: role detail -->
  <rect x="332" y="138" width="700" height="712" fill="#ffffff"/>
  <text x="352" y="170" font-size="18" font-weight="700" fill="#111827">Software Engineer</text>
  <text x="520" y="170" font-size="13" fill="#6b7280">· Senior</text>
  <text x="352" y="190" font-size="13" fill="#6b7280">Field Ops Platform — Northstar Energy</text>

  <rect x="352" y="206" width="660" height="20" rx="4" fill="#e5e7eb"/>
  <text x="364" y="220" font-size="10" fill="#6b7280">ALLOCATION 100% · WINDOW 2026-11-16 → 2027-05-28 · PRIORITY Must fill</text>

  <!-- Proposed-project callout example -->
  <rect x="352" y="242" width="660" height="64" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="368" y="264" font-size="12" fill="#78350f" font-weight="700">Enrollment Redesign is Proposed, not signed. Win probability 60%.</text>
  <text x="368" y="282" font-size="11" fill="#78350f">Filling this role records a Tentative assignment, not a committed one.</text>
  <text x="368" y="296" font-size="10" fill="#92400e">(shown here as the example of this state — current role above is confirmed work)</text>

  <!-- skills chips row -->
  <text x="352" y="330" font-size="10" fill="#6b7280" letter-spacing="1">SKILLS NEEDED</text>
  <rect x="352" y="338" width="50" height="22" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="362" y="353" font-size="11" fill="#374151">.NET</text>
  <rect x="408" y="338" width="56" height="22" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="418" y="353" font-size="11" fill="#374151">Azure</text>
  <rect x="470" y="338" width="46" height="22" rx="4" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="480" y="353" font-size="11" fill="#374151">SQL</text>

  <!-- candidate list preview (collapsed, pointing to wireframe 02) -->
  <rect x="352" y="376" width="660" height="140" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <text x="372" y="406" font-size="13" fill="#9ca3af">Ranked candidate list — see 02-decision-ranking.svg</text>
  <text x="372" y="426" font-size="11" fill="#9ca3af">(skills matched · availability · level fit · conflict flags)</text>

  <!-- ============ Numbered badges on the elements themselves ============ -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="296" cy="172" r="11" fill="#1d4ed8"/>
    <text x="296" y="176">1</text>

    <circle cx="296" cy="452" r="11" fill="#1d4ed8"/>
    <text x="296" y="456">2</text>

    <circle cx="1000" cy="236" r="11" fill="#b91c1c"/>
    <text x="1000" y="240">3</text>
  </g>

  <!-- ============ Legend, below the frame — no crossing lines, nothing covered ============ -->
  <g font-size="13">
    <circle cx="56" cy="876" r="10" fill="#1d4ed8"/>
    <text x="56" y="880" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">1</text>
    <text x="76" y="881" fill="#111827" font-weight="700">Priority-sorted, not alphabetical.</text>
    <text x="76" y="898" fill="#4b5563">Must fill → Nice to fill → If won — the role with no backup plan if empty is first, unscrolled.</text>

    <circle cx="56" cy="922" r="10" fill="#1d4ed8"/>
    <text x="56" y="926" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">2</text>
    <text x="76" y="927" fill="#111827" font-weight="700">Filled roles stay in the list.</text>
    <text x="76" y="944" fill="#4b5563">A role just acted on doesn't vanish — the RM keeps their place and the fact stays visible.</text>

    <circle cx="56" cy="968" r="10" fill="#b91c1c"/>
    <text x="56" y="972" font-weight="700" fill="#ffffff" text-anchor="middle" font-size="11">3</text>
    <text x="76" y="973" fill="#111827" font-weight="700">The constraint shows before the people do.</text>
    <text x="76" y="990" fill="#4b5563">An RM sees "this is a bet on a client decision" before scanning candidates — not after committing to a name.</text>
  </g>

  <!-- footer -->
  <text x="40" y="1040" font-size="11" fill="#9ca3af">Harbor &amp; Pine staffing flow · wireframe 1 of 3 · grayscale = structure, accent color = annotation, not UI</text>
</svg>
